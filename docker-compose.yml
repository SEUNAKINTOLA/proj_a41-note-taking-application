version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vloguser:vlogpass@postgres:5432/vlogdb
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'require("http").get("http://localhost:8080/health", (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})'
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: 'postgres:15-alpine'
    environment:
      POSTGRES_USER: vloguser
      POSTGRES_PASSWORD: vlogpass
      POSTGRES_DB: vlogdb
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U vloguser'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: {}
